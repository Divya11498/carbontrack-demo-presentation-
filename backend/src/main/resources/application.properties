
spring.application.name=carbontrack

# Optional .env configuration
spring.config.import=optional:file:.env[.properties]

# Supabase PostgreSQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true

# JWT Authentication
spring.jwt.secret=${JWT_SECRET}
app.jwt.secret=${JWT_SECRET}

# Gemini AI
gemini.api.key=${GEMINI_API_KEY:}

# Google OAuth
app.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Redis Cache
spring.data.redis.host=${UPSTASH_REDIS_HOST:localhost}
spring.data.redis.port=${UPSTASH_REDIS_PORT:6379}
spring.data.redis.password=${UPSTASH_REDIS_PASSWORD:}
spring.data.redis.timeout=500ms
spring.data.redis.repositories.enabled=false

# Email Notifications
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@carbontrack.local}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
